# Temporary, branch-scoped capture helper. Removed before PR merge.
# Captures a real locally served Studio view; no synthetic mockups.
name: Capture Infrastructure Studio README screenshot
on:
  push:
    branches:
      - docs/studio-readme-preview
    paths:
      - .github/workflows/capture-studio-preview.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Python 3.14 for local preview
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - name: Install local screenshot browser
        run: |
          python -m pip install --no-cache-dir playwright==1.65.2
          python -m playwright install --with-deps chromium
      - name: Capture actual working Studio UI
        shell: bash
        run: |
          set -Eeuo pipefail
          python engineering-lab/serve.py --port 8765 > /tmp/studio-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 25); do
            if curl --noproxy '*' -fsS --max-time 2 http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p docs/assets
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          output = Path("docs/assets/infrastructure-studio-system-map.png")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--no-sandbox"])
              page = browser.new_page(viewport={"width": 1600, "height": 1040}, device_scale_factor=1)
              response = page.goto("http://127.0.0.1:8765/", wait_until="networkidle")
              assert response.status == 200, "Studio did not return HTTP 200"
              page.locator("#tab-map").click()
              page.wait_for_function("document.querySelector('#topology').children.length > 5")
              assert page.locator("#inspector-name").inner_text().strip(), "Architecture inspector missing"
              page.evaluate("""() => {
                const tab = document.querySelector('.tabs');
                window.scrollTo({top: tab.getBoundingClientRect().top + window.scrollY - 18, behavior: 'instant'});
              }""")
              page.wait_for_timeout(300)
              page.screenshot(path=str(output), animations="disabled")
              print(f"Actual {page.title()} screenshot captured: {output} ({output.stat().st_size} bytes)")
              browser.close()
          PY
          test -s docs/assets/infrastructure-studio-system-map.png
      - name: Commit screenshot only to this preview branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/assets/infrastructure-studio-system-map.png
          git commit -m "docs: capture actual Infrastructure Studio system map for README"
          # Branch may have advanced while Chromium was installing. Rebase this
          # one generated PNG on current remote state; never force-push.
          git fetch origin docs/studio-readme-preview
          git rebase FETCH_HEAD
          git push origin HEAD:docs/studio-readme-preview
