name: CD
on:
  workflow_run:
    workflows: ["terraform-quality-gates"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: terraform-studio-publish-main
  cancel-in-progress: false
jobs:
  publish:
    name: Publish verified Studio and IaC bundle
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Confirm exact successful CI attempt and current main
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_RUN" =~ ^[0-9]+$ && "$CI_ATTEMPT" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TESTED_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/attempts/$CI_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/ci-jobs.json"
          python3 - "$RUNNER_TEMP/ci-jobs.json" <<'PY'
          import json, sys
          wanted = {
              "Terraform format / validation / mock tests",
              "Studio Docker reproducibility / static security smoke",
              "Trivy IaC security scan",
              "Gitleaks secret scan (full history)",
              "Floci AWS API integration (apply / verify / destroy)",
              "Local Linux VM / Terraform validation",
          }
          jobs = json.load(open(sys.argv[1], encoding="utf-8"))["jobs"]
          assert len(jobs) == len(wanted) and {j["name"] for j in jobs} == wanted
          assert all(j["status"] == "completed" and j["conclusion"] == "success" for j in jobs)
          print("[PASS] All six gates passed on the triggering CI attempt")
          PY
      - name: Checkout the tested revision without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify source identity and release archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          python3 scripts/package-release.py "$TESTED_SHA" "$RUNNER_TEMP/delivery"
      - name: Prepare registry identity
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5
      - name: Log in to GHCR using the ephemeral workflow token
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/studio.Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
      - name: Set up pinned Trivy
        run: bash scripts/setup-trivy.sh
      - name: Pull, scan and smoke the exact registry digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$TESTED_SHA"
          sh scripts/scan-image.sh "$IMAGE"
          bash scripts/smoke-studio-image.sh "$IMAGE"
      - name: Recheck main before promoting the verified digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          NAME: ${{ steps.image.outputs.name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$TESTED_SHA"
          docker buildx imagetools create --prefer-index=false \
            --tag "$NAME:sha-$TESTED_SHA" --tag "$NAME:latest" "$IMAGE"
          for tag in "$NAME:sha-$TESTED_SHA" "$NAME:latest"; do
            docker buildx imagetools inspect "$tag" | grep -Fx "Digest:    ${IMAGE##*@}"
          done
      - name: Write verified delivery evidence
        env:
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          CI_RUN: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/delivery" <<'PY'
          import json, os, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          evidence = {"git_sha": os.environ["TESTED_SHA"], "image": os.environ["IMAGE"],
                      "ci_run_id": os.environ["CI_RUN"], "platform": "linux/amd64",
                      "real_aws_deployed": False}
          (out / "delivery.json").write_text(json.dumps(evidence, indent=2) + "\n")
          PY
          printf 'Verified commit: `%s`\n\nVerified Studio: `%s`\n\nNo AWS deployment performed.\n' "$TESTED_SHA" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified source bundle and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: terraform-aws-lab-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/delivery/
          if-no-files-found: error
          retention-days: 30
